# Every push to main builds the Windows installer and the macOS disk images, and publishes them as one
# GitHub release, so anyone can install the latest Glassbox from the Releases page.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Each build gets its own version, so releases sort and installed copies update in place. The major
  # and minor come from package.json; the patch is one more than the last release of that line (or 0
  # for the first), so nothing needs editing per release. To start 1.1 or 2.0, change package.json.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          LINE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          LAST=$(git tag -l "v$LINE.*" | sed "s/^v$LINE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "version=$LINE.$(( ${LAST:--1} + 1 ))" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml and the blockmap are what installed copies read to update themselves.
          path: |
            release/Glassbox-Setup-${{ env.VERSION }}.exe
            release/Glassbox-Setup-${{ env.VERSION }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  mac:
    # Apple Silicon only: the speech engine (onnxruntime) no longer ships an Intel Mac build.
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
    needs: version
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # No Apple Developer certificate yet: the app is ad-hoc signed (package.json), so don't look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build disk image
        run: npm run dist:mac
      - name: Check the app has this Mac's native parts
        run: |
          APP="$(ls -d release/mac*/Glassbox.app | head -1)/Contents/Resources/app.asar.unpacked/node_modules"
          ls "$APP/@anthropic-ai/claude-agent-sdk-darwin-${{ matrix.arch }}/claude"
          ls "$APP/node-pty/prebuilds/darwin-${{ matrix.arch }}"
          ls "$APP/onnxruntime-node/bin/napi-v6/darwin/${{ matrix.arch }}"
          codesign --verify --verbose=2 "$(ls -d release/mac*/Glassbox.app | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release/Glassbox-${{ env.VERSION }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Glassbox ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            Built from ${{ github.sha }}.

            **Windows:** download `Glassbox-Setup-${{ env.VERSION }}.exe` and run it. It installs for your user only (no admin needed), adds Start menu and desktop shortcuts, and is removed from Settings > Apps. Once installed, it updates itself: new versions download in the background and a **Restart to update** button appears in the title bar. It isn't code-signed yet, so if SmartScreen warns about an unknown publisher, choose **More info**, then **Run anyway**.

            **macOS:** download `Glassbox-${{ env.VERSION }}-arm64.dmg` (Apple Silicon: M1 and later), open it and drag Glassbox to Applications. It isn't notarized yet, so the first time, right-click Glassbox in Applications and choose **Open**. If macOS says it's damaged, run `xattr -dr com.apple.quarantine /Applications/Glassbox.app` in Terminal and open it again. Glassbox tells you when a newer version is out (the Mac build can't replace itself until it's signed with an Apple certificate).

            You need Claude Code signed in on the machine (`claude auth login`). Git is needed for the git features; the GitHub CLI is optional.
